version: "3.8"

services:
  placard:
    build: .
    container_name: placard
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - SQLITE_DB_PATH=/app/data/tokens.db
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_API_VERSION=${META_API_VERSION:-v22.0}
      - META_OAUTH_CALLBACK_URL=${META_OAUTH_CALLBACK_URL}
    volumes:
      - placard-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  placard-data:
